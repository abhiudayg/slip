<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient matching screen surface -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#181717"/>
      <stop offset="60%" stop-color="#0f0e0e"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>

    <!-- Frosted border stroke gradient -->
    <linearGradient id="squircleStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <!-- Inner Card Background Gradient: matches bg-surface-container / bg-white/[0.04] -->
    <linearGradient id="innerCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222121"/>
      <stop offset="100%" stop-color="#161515"/>
    </linearGradient>

    <!-- Inner Card Border Stroke -->
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon / Squircle Canvas Frame (Full 512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="url(#squircleStroke)" stroke-width="2"/>

  <!-- Centered Login Screen Outer Pass Tile (w-28 h-28 -> 296x296 centered at x=108, y=108) -->
  <!-- bg-surface-container rounded-3xl border border-glass-border -->
  <g filter="url(#softShadow)">
    <rect x="108" y="108" width="296" height="296" rx="64" fill="url(#innerCardBg)" stroke="url(#cardStroke)" stroke-width="2.5"/>

    <!-- Top notch indicator pill: w-8 h-1 bg-white/20 rounded-full -> centered at x=256, width=64, height=6, rx=3, y=134 -->
    <rect x="224" y="132" width="64" height="6" rx="3" fill="rgba(255, 255, 255, 0.22)"/>

    <!-- Dashed perforation line: border-b border-dashed border-white/10 -> y=168, from x=144 to x=368 -->
    <line x1="144" y1="168" x2="368" y2="168" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" stroke-dasharray="6, 6"/>

    <!-- Center Ticket Pass Silhouette Icon Container (w-12 h-12 -> 92x92 centered at x=210, y=200) -->
    <!-- bg-white/5 border border-white/10 rounded-2xl with Material Symbol 'confirmation_number' -->
    <g transform="translate(210, 196)">
      <!-- Rounded badge backdrop -->
      <rect x="0" y="0" width="92" height="92" rx="26" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2"/>

      <!-- Exact Material Symbol 'confirmation_number' (Ticket with side circular notches and dashed center line) -->
      <!-- Scaled and centered to fit 56x56 inside the 92x92 box (offset x=18, y=18) -->
      <g transform="translate(18, 18) scale(2.333)">
        <path d="M 22 10 V 6 C 22 4.9 21.1 4 20 4 H 4 C 2.9 4 2.01 4.9 2.01 6 V 10 C 3.11 10 4 10.9 4 12 C 4 13.1 3.11 14 2 14 V 18 C 2 19.1 2.9 20 4 20 H 20 C 21.1 20 22 19.1 22 18 V 14 C 20.9 14 20 13.1 20 12 C 20 10.9 20.9 10 22 10 Z M 20 8.54 C 18.78 9.22 18 10.51 18 12 C 18 13.49 18.78 14.79 20 15.45 V 18 H 4 V 15.45 C 5.22 14.78 6 13.49 6 12 C 6 10.51 5.22 9.22 4 8.54 V 6 H 20 V 8.54 Z M 11 15 H 13 V 17 H 11 V 15 Z M 11 11 H 13 V 13 H 11 V 11 Z M 11 7 H 13 V 9 H 11 V 7 Z" 
              fill="#ffffff" 
              opacity="0.95"/>
      </g>
    </g>

    <!-- Bottom Cryptographic Barcode Stub (flex items-center gap-1.5 opacity-40) -->
    <!-- Bars: h-3 (approx 20px high in SVG), width 2px to 4px, white rounded-full, perfectly centered -->
    <g transform="translate(196, 318)" opacity="0.45">
      <rect x="0" y="0" width="4" height="22" rx="2" fill="#ffffff"/>
      <rect x="9" y="0" width="8" height="22" rx="2.5" fill="#ffffff"/>
      <rect x="22" y="0" width="4" height="22" rx="2" fill="#ffffff"/>
      <rect x="31" y="0" width="12" height="22" rx="2.5" fill="#ffffff"/>
      <rect x="48" y="0" width="4" height="22" rx="2" fill="#ffffff"/>
      <rect x="57" y="0" width="8" height="22" rx="2.5" fill="#ffffff"/>
      <rect x="70" y="0" width="12" height="22" rx="2.5" fill="#ffffff"/>
      <rect x="87" y="0" width="4" height="22" rx="2" fill="#ffffff"/>
      <rect x="96" y="0" width="8" height="22" rx="2.5" fill="#ffffff"/>
      <rect x="109" y="0" width="4" height="22" rx="2" fill="#ffffff"/>
      <rect x="118" y="0" width="2" height="22" rx="1" fill="#ffffff"/>
    </g>
  </g>
</svg>