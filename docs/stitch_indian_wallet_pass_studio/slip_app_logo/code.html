<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e18" />
      <stop offset="50%" stop-color="#11131d" />
      <stop offset="100%" stop-color="#191b26" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#7c3aed" opacity="0.25" filter="url(#glow)"/>
  <circle cx="210" cy="200" r="100" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>

  <!-- Pass Slot Backplate / Pocket -->
  <rect x="136" y="160" width="240" height="230" rx="28" fill="#131522" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- S-Curve Slip Pass (Sliding upward smoothly) -->
  <g transform="translate(0, -10)">
    <!-- Lower Card Tail / Shadow Layer -->
    <path d="M176 340 C 230 365, 282 315, 336 340" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

    <!-- Main Sliding Pass Card ("S" curve & ticket silhouette) -->
    <path d="M164 190 C 164 165, 185 145, 210 145 L 302 145 C 327 145, 348 165, 348 190 L 348 290 C 310 260, 270 330, 210 295 C 175 275, 164 245, 164 210 Z" 
          fill="url(#purpleGrad)" 
          opacity="0.95"/>
          
    <!-- Specular highlight on Card -->
    <path d="M166 190 C 166 167, 186 147, 210 147 L 302 147 C 326 147, 346 167, 346 190" 
          fill="none" 
          stroke="url(#glassStroke)" 
          stroke-width="3"/>

    <!-- The 'S' ribbon fold / Slip dynamic motion -->
    <path d="M190 200 C 220 180, 290 190, 315 230 C 330 255, 310 285, 260 290 C 210 295, 190 325, 215 355 C 240 380, 310 370, 330 340" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner Core Notch / NFC wave mark -->
    <circle cx="256" cy="215" r="9" fill="#ffffff" opacity="0.95"/>
    <path d="M275 205 C 283 213, 283 227, 275 235" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Front Pocket Rim (Simulating pass sliding out of pocket) -->
  <path d="M136 295 C 190 280, 322 280, 376 295 L 376 362 C 376 378, 362 390, 346 390 L 166 390 C 150 390, 136 378, 136 362 Z" 
        fill="#1a1c2a" 
        fill-opacity="0.75" 
        stroke="url(#glassStroke)" 
        stroke-width="2"/>
  <line x1="160" y1="293" x2="352" y2="293" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
