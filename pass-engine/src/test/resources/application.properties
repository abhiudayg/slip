# Force isolated H2 for tests regardless of developer shell env (Neon/OCI).
spring.datasource.url=jdbc:h2:mem:slip_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
slip.templates-dir=../templates
slip.stations-dir=../stations
slip.dev-mode=true
server.port=0
