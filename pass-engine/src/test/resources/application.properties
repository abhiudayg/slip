spring.datasource.url=jdbc:h2:mem:slip;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
slip.templates-dir=../templates
slip.stations-dir=../stations
slip.dev-mode=true
slip.pass-type-identifier=pass.com.slip.wallet
slip.team-identifier=TEAMIDXXXX
slip.certificate-path=
slip.certificate-password=
slip.wwdr-certificate-path=
