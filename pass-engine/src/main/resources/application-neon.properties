# Activate with: SPRING_PROFILES_ACTIVE=neon  (and DATABASE_URL pointing at Neon)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
slip.dev-mode=${PASS_ENGINE_DEV_MODE:false}
slip.nfc-encryption-public-key=${SLIP_NFC_ENCRYPTION_PUBLIC_KEY:}
slip.web-service-url=${SLIP_WEB_SERVICE_URL:}
