server.port=8080

# HTTP access logs must never include pass field bodies (QR / PNR / UPI).
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=WARN

slip.templates-dir=${SLIP_TEMPLATES_DIR:../templates}
slip.stations-dir=${SLIP_STATIONS_DIR:../stations}
slip.dev-mode=${PASS_ENGINE_DEV_MODE:true}
slip.pass-type-identifier=${PASS_TYPE_IDENTIFIER:pass.com.slip.wallet}
slip.team-identifier=${TEAM_IDENTIFIER:TEAMIDXXXX}
slip.certificate-path=${PASS_CERTIFICATE_PATH:}
slip.certificate-password=${PASS_CERTIFICATE_PASSWORD:}
slip.wwdr-certificate-path=${WWDR_CERTIFICATE_PATH:}

# Local default: embedded H2 (catalogs fall back to JSON files if tables empty).
# Production / OCI: set DATABASE_URL to Neon (postgresql://... or jdbc:postgresql://...).
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/slip;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway runs against Neon in prod (see application-neon.properties). Off for local H2.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
slip.nfc-encryption-public-key=${SLIP_NFC_ENCRYPTION_PUBLIC_KEY:}
slip.web-service-url=${SLIP_WEB_SERVICE_URL:}
