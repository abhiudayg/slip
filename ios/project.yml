name: Slip
options:
  bundleIdPrefix: com.aeswibon
  deploymentTarget:
    iOS: "27.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9HSMVVUMVX"
    SWIFT_VERSION: "5.0"
configs:
  Debug: debug
  Release: release

targets:
  Slip:
    type: application
    platform: iOS
    sources:
      - path: Slip
        excludes:
          - Resources/**
      - path: SlipShared
      - path: SlipActivityShared
    resources:
      - path: Slip/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip
        INFOPLIST_FILE: Slip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Slip/Slip.entitlements
        PRODUCT_NAME: Slip
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: "9HSMVVUMVX"
        CODE_SIGN_STYLE: Automatic
        BASE_SDK: iphoneos
    dependencies:
      - sdk: AppIntents.framework
      - target: SlipShareExtension
        embed: true
      - target: SlipWidgets
        embed: true
      # SlipWatch is a separate target (requires watchOS SDK to embed).
      # Build scheme "SlipWatch" when a watchOS runtime is installed.
    scheme:
      testTargets: 
        - SlipTests
        - SlipUITests
      gatherCoverageData: false

  SlipShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SlipShareExtension
      - path: SlipShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.share
        INFOPLIST_FILE: SlipShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SlipShareExtension/SlipShareExtension.entitlements
        PRODUCT_NAME: SlipShareExtension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "9HSMVVUMVX"
        CODE_SIGN_STYLE: Automatic
        BASE_SDK: iphoneos
        APPINTENTS_METADATA_GENERATION: NO

  SlipWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SlipWidgets
      - path: SlipActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.widgets
        INFOPLIST_FILE: SlipWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SlipWidgets/SlipWidgets.entitlements
        PRODUCT_NAME: SlipWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "9HSMVVUMVX"
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        BASE_SDK: iphoneos
        APPINTENTS_METADATA_GENERATION: NO

  SlipWatch:
    type: application
    platform: watchOS
    sources:
      - path: SlipWatch
        excludes:
          - Assets.xcassets
      - path: SlipActivityShared
    resources:
      - path: SlipWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.watchkitapp
        INFOPLIST_FILE: SlipWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SlipWatch/SlipWatch.entitlements
        PRODUCT_NAME: Slip Watch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        DEVELOPMENT_TEAM: "9HSMVVUMVX"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SlipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlipTests
    dependencies:
      - target: Slip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Slip.app/Slip
        BUNDLE_LOADER: $(TEST_HOST)

  SlipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SlipUITests
    dependencies:
      - target: Slip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.uitests
        TEST_TARGET_NAME: Slip
