name: Slip
options:
  bundleIdPrefix: com.aeswibon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  BASE_SDK: iphoneos
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: "9HSMVVUMVX"
  TARGETED_DEVICE_FAMILY: "1"
  SWIFT_VERSION: "5.0"
configs:
  Debug: debug
  Release: release

targets:
  Slip:
    type: application
    platform: iOS
    sources:
      - path: Slip
      - path: SlipShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip
      INFOPLIST_FILE: Slip/Info.plist
      CODE_SIGN_ENTITLEMENTS: Slip/Slip.entitlements
      PRODUCT_NAME: Slip
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SlipShareExtension
        embed: true
    scheme:
      testTargets: []

  SlipShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SlipShareExtension
      - path: SlipShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aeswibon.slip.share
      INFOPLIST_FILE: SlipShareExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: SlipShareExtension/SlipShareExtension.entitlements
      PRODUCT_NAME: SlipShareExtension
      GENERATE_INFOPLIST_FILE: false
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
