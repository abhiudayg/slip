<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1f2329"/>
      <stop offset="60%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Card Primary Gradient -->
    <linearGradient id="cardGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262c"/>
      <stop offset="100%" stop-color="#141519"/>
    </linearGradient>

    <!-- Card Secondary Gradient -->
    <linearGradient id="cardGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a20"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glowAccent" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGlow)"/>
  
  <!-- Subtle Outer Rim Reflection -->
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Back Slip (Layered Card behind) -->
  <g transform="translate(195, 120) rotate(14) translate(-120, -140)" filter="url(#dropShadow)" opacity="0.65">
    <rect x="30" y="30" width="220" height="300" rx="26" fill="url(#cardGradBack)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <line x1="50" y1="80" x2="140" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="100" x2="90" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Front Pass/Slip Ticket Shell -->
  <g filter="url(#dropShadow)">
    <!-- Base Card Body with Ticket Cutouts / Notches -->
    <path d="
      M 166 110 
      H 346 
      A 26 26 0 0 1 372 136 
      V 245 
      A 15 15 0 0 0 372 275 
      V 376 
      A 26 26 0 0 1 346 402 
      H 166 
      A 26 26 0 0 1 140 376 
      V 275 
      A 15 15 0 0 0 140 245 
      V 136 
      A 26 26 0 0 1 166 110 
      Z
    " fill="url(#cardGradFront)" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Perforated Tear Line Between Pass Header and Barcode/Security Stub -->
    <line x1="162" y1="260" x2="350" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="2.5" stroke-dasharray="6, 6"/>

    <!-- Glowing Accent Chip / Barcode Symbol / NFC Crest -->
    <g transform="translate(256, 185)">
      <!-- Outer NFC Radiating Arc 2 -->
      <path d="M -38 -20 A 42 42 0 0 1 38 -20" fill="none" stroke="url(#neonGradient)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <!-- Middle NFC Arc 1 -->
      <path d="M -26 -10 A 28 28 0 0 1 26 -10" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- Inner Core Dot / Spark -->
      <circle cx="0" cy="2" r="5.5" fill="#00f5a0" filter="url(#glowAccent)"/>
    </g>

    <!-- Monogram 'S' (Slip) in Pass Identity -->
    <text x="256" y="235" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#ffffff" 
          text-anchor="middle" 
          opacity="0.95">SLIP</text>

    <!-- Stub Content / Digital Security Key Matrix -->
    <!-- Minimalist Data Barcode / Cryptographic bars -->
    <g transform="translate(196, 288)" opacity="0.85">
      <rect x="0" y="0" width="4" height="42" rx="2" fill="rgba(255,255,255,0.7)"/>
      <rect x="8" y="0" width="8" height="42" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="20" y="0" width="4" height="42" rx="2" fill="rgba(255,255,255,0.4)"/>
      <rect x="28" y="0" width="12" height="42" rx="2" fill="url(#neonGradient)"/>
      <rect x="44" y="0" width="4" height="42" rx="2" fill="rgba(255,255,255,0.6)"/>
      <rect x="52" y="0" width="8" height="42" rx="2" fill="rgba(255,255,255,0.85)"/>
      <rect x="64" y="0" width="6" height="42" rx="2" fill="rgba(255,255,255,0.4)"/>
      <rect x="74" y="0" width="14" height="42" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="92" y="0" width="6" height="42" rx="2" fill="url(#neonGradient)"/>
      <rect x="102" y="0" width="4" height="42" rx="2" fill="rgba(255,255,255,0.5)"/>
      <rect x="110" y="0" width="10" height="42" rx="2" fill="rgba(255,255,255,0.8)"/>
    </g>

    <text x="256" y="360" 
          font-family="'SF Mono', 'SF Pro Text', Menlo, monospace" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="rgba(255,255,255,0.4)" 
          text-anchor="middle">VAS 2.0 ENCRYPTED</text>
  </g>
</svg>